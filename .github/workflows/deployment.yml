name: deployment

on:
  push:
    branches:
      - master
      - uat

jobs:
  deploy:
    # Pushes to master go to production (opencyphal.org); pushes to uat go to uat.opencyphal.org.
    name: Deploy website
    # This runner is dedicated to this repository and runs on the web server itself, so deployment is a local copy.
    # It must only ever run jobs for pushes to the branches above: never add pull request jobs that use it.
    runs-on: [self-hosted, opencyphal-org]
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/master' && 'production' || 'uat' }}
      cancel-in-progress: false
    env:
      SITE: ${{ github.ref == 'refs/heads/master' && 'opencyphal.org' || 'uat.opencyphal.org' }}

    steps:
      - uses: actions/checkout@v7

      # The server (Apache with mod_wsgi in daemon mode, one process group per site) keeps the code of each
      # deployment in /var/www/<site> and its virtualenv in /opt/venv/<site>; the runner's user owns both.
      # Apache keeps serving during the update, so the order matters: dependencies first, then the code,
      # and the WSGI script last, because mod_wsgi reloads the application when that file's timestamp changes.
      - name: Deploy
        run: |
          python3 -m venv "/opt/venv/$SITE"
          "/opt/venv/$SITE/bin/pip" install --quiet -r requirements.txt
          rsync -rlpt --delete --chmod=D755,F644 --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='website.wsgi' ./ "/var/www/$SITE/"
          rsync -p --chmod=F644 website.wsgi "/var/www/$SITE/"
          touch "/var/www/$SITE/website.wsgi"

      - name: Check that the deployed website responds
        run: |
          status=$(curl --silent --show-error --retry 5 --retry-all-errors --output /dev/null \
            --write-out '%{http_code}' -H "Host: $SITE" http://localhost/)
          echo "HTTP $status"
          test "$status" = 200
